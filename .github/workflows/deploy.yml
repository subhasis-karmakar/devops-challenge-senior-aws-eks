name: Deploy-Application-to-Amazon-EKS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Deployment Manifest
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

          sed -i "s|image: .*|image: ${IMAGE}|g" k8s/deployment.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/particle41-app -n particle41

      - name: Verify Resources
        run: |
          kubectl get all -n particle41

      - name: Verify Ingress
        run: |
          kubectl get ingress -n particle41

      - name: Wait for ALB Address
        run: |
          echo "Waiting for AWS Load Balancer to become available..."

          for i in {1..30}; do
            ADDRESS=$(kubectl get ingress particle41-ingress \
              -n particle41 \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$ADDRESS" ]; then
              echo "ALB is ready."
              echo "ALB_ADDRESS=$ADDRESS" >> $GITHUB_ENV
              break
            fi

            echo "Attempt $i/30 - ALB not ready yet..."
            sleep 10
          done

      - name: Display Application URL
        run: |
          echo "======================================"
          echo "Application URL"
          echo "http://$ALB_ADDRESS"
          echo "======================================"
